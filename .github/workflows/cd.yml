name: CD (CT inside, HF-first)

on:
  # Arranca CD cuando el workflow de CI termina en main
  workflow_run:
    workflows: ["CI (Multi-Job)"]
    types: [completed]
    branches: [main]

  # (Opcionales) ejecución manual y por drift
  workflow_dispatch: {}
  repository_dispatch:
    types: [drift-detected, data-updated]

env:
  ACCURACY_THRESHOLD: "0.90"
  HF_MODEL_ID:   ${{ secrets.HF_MODEL_ID }}
  HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
  HF_SPACE_ID:   ${{ secrets.HF_SPACE_ID }}

jobs:
  train:
    # Solo corre si:
    # - viene de workflow_run y CI terminó success, o
    # - viene de repository_dispatch (drift), o
    # - viene de workflow_dispatch (manual)
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Train (CT)
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          python train.py | tee train_log.txt

      - name: Upload artifacts (model + metrics)
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/model-latest.pkl
            metrics.json

      - id: gate
        name: Gate (accuracy ≥ ${{ env.ACCURACY_THRESHOLD }})
        shell: bash
        run: |
          ACC=$(python -c "import json;print(json.load(open('metrics.json'))['accuracy'])")
          THR=${{ env.ACCURACY_THRESHOLD }}
          echo "Accuracy=$ACC  Threshold=$THR"
          if python -c "import sys; acc=float('$ACC'); thr=float('$THR'); sys.exit(0 if acc>=thr else 1)"; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

  publish_dataset:
    name: Publish dataset (data/ + metrics.json)
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model-and-metrics
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push dataset to HF Hub
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ env.HF_DATASET_ID }}
        run: |
          python -m pip install -U huggingface_hub
          if [ -d "data" ]; then
            python -c "from huggingface_hub import HfApi, create_repo, upload_folder; import os; api=HfApi(token=os.environ['HF_TOKEN']); rid=os.environ['HF_DATASET_ID']; create_repo(rid, repo_type='dataset', exist_ok=True); upload_folder(repo_id=rid, repo_type='dataset', folder_path='data', path_in_repo='data', commit_message='Update data')"
          fi
          if [ -f metrics.json ]; then
            python -c "from huggingface_hub import HfApi, upload_folder; import os; api=HfApi(token=os.environ['HF_TOKEN']); rid=os.environ['HF_DATASET_ID']; upload_folder(repo_id=rid, repo_type='dataset', folder_path='.', path_in_repo='.', allow_patterns=['metrics.json'], commit_message='Update metrics')"
          fi

  publish_model:
    name: Publish model (HF Model repo)
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model-and-metrics
          path: models

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push model to HF Hub
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_MODEL_ID: ${{ env.HF_MODEL_ID }}
        run: |
          python -m pip install -U huggingface_hub
          mkdir -p models
          date +run-%Y%m%d-%H%M%S > models/MODEL_VERSION.txt
          python -c "from huggingface_hub import HfApi, create_repo, upload_folder; import os; api=HfApi(token=os.environ['HF_TOKEN']); mid=os.environ['HF_MODEL_ID']; create_repo(mid, repo_type='model', exist_ok=True); upload_folder(repo_id=mid, repo_type='model', folder_path='models', path_in_repo='.', commit_message='Upload trained model')"

  deploy:
    name: Deploy Space
    runs-on: ubuntu-latest
    needs: [train, publish_model, publish_dataset]
    if: needs.train.outputs.approved == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model-and-metrics
          path: models

      - name: Verify model exists before deploy
        run: |
          echo "Workspace content:" && ls -lah
          echo "Models content:" && ls -lah models || true
          test -f models/model-latest.pkl || (echo "models/model-latest.pkl not found" && exit 1)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy Space (update app + model)
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ env.HF_SPACE_ID }}
        run: |
          python -m pip install -U huggingface_hub
          python -c "from huggingface_hub import HfApi, create_repo, upload_folder; import os; api=HfApi(token=os.environ['HF_TOKEN']); sid=os.environ['HF_SPACE_ID']; create_repo(sid, repo_type='space', space_sdk='gradio', exist_ok=True); upload_folder(repo_id=sid, repo_type='space', folder_path='.', path_in_repo='.', commit_message='CD: refresh Space with approved model')"
