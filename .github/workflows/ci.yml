name: CI (Multi-Job)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    name: 1) Build env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

  lint:
    name: 2) Lint (ruff)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install ruff
          ruff check .

  tests:
    name: 3) Tests (pytest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install -r requirements.txt
          pytest -q

  package:
    name: 4) Package (app bundle)
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - name: Bundle
        run: |
          mkdir -p dist
          cp -r app.py model_utils.py requirements.txt models dist/ || true
          cd dist && zip -r app_bundle.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: dist/app_bundle.zip
