name: Monitor & Drift (HF Hub)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

env:
  HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
  DRIFT_P_THRESHOLD: "0.3"

jobs:
  collect:
    name: 1) Collect from Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Download dataset repo
        run: |
          python - <<'PY'
from huggingface_hub import snapshot_download
import os, shutil
rid = os.environ["HF_DATASET_ID"]
local_dir = snapshot_download(repo_id=rid, repo_type="dataset")
os.makedirs("monitoring", exist_ok=True)
os.makedirs("data", exist_ok=True)
def cp(p, dst):
    import shutil, os
    src = os.path.join(local_dir, p)
    if os.path.exists(src):
        shutil.copy2(src, p)
cp("monitoring/prod_log.csv", "monitoring/prod_log.csv")
cp("data/reference.csv", "data/reference.csv")
print("Collected files.")
PY
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-data
          path: |
            monitoring/
            data/

  drift_report:
    name: 2) Drift report (Evidently)
    runs-on: ubuntu-latest
    needs: collect
    outputs:
      drifted: ${{ steps.compute.outputs.drifted }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: monitoring-data, path: . }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python -m pip install -U pip
          pip install evidently pandas huggingface_hub
      - id: compute
        run: |
          python - <<'PY'
import os, json, pandas as pd
from evidently.report import Report
from evidently.metrics import DatasetDriftMetric, ColumnDriftMetric

os.makedirs("reports", exist_ok=True)
ref_p = "data/reference.csv"
prd_p = "monitoring/prod_log.csv"

if not (os.path.exists(ref_p) and os.path.exists(prd_p)):
    open("reports/drift.flag","w").write("false")
    print("drifted=false")
else:
    ref = pd.read_csv(ref_p)
    cur = pd.read_csv(prd_p)
    report = Report(metrics=[DatasetDriftMetric(), ColumnDriftMetric(column_name="prediction")])
    report.run(reference_data=ref, current_data=cur)
    out = report.as_dict()
    drifted = bool(out["metrics"][0]["result"]["dataset_drift"]) or \
              (out["metrics"][0]["result"].get("drift_share",0.0) >= float(os.getenv("DRIFT_P_THRESHOLD","0.3")))
    json.dump(out, open("reports/drift_summary.json","w"), indent=2)
    open("reports/drift.flag","w").write("true" if drifted else "false")
    print("drifted=", drifted)
PY
          echo "drifted=$(cat reports/drift.flag)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/
      - name: Push reports to dataset (optional)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
        run: |
          python - <<'PY'
from huggingface_hub import HfApi, upload_folder
import os
api = HfApi(token=os.environ["HF_TOKEN"])
rid = os.environ["HF_DATASET_ID"]
upload_folder(repo_id=rid, repo_type="dataset",
              folder_path="reports", path_in_repo="metrics",
              commit_message="Upload monitoring reports")
PY

  trigger_retrain:
    name: 3) Trigger retrain
    runs-on: ubuntu-latest
    needs: drift_report
    if: needs.drift_report.outputs.drifted == 'true'
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: drift-detected
          client-payload: '{"reason":"drift"}'
